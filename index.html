<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tip & Delivery Functions</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
            box-shadow: 0px 5px 7px  rgba(0,0,0,0.3);
            border-radius: 16px;
        }
      

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 30px;
            margin-bottom: 10px;
            color: #1e75a0;
        }

        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.6;
            overflow-x: auto;
        }

    </style>
</head>
<body>
  <div>
    <h1>Tip & Delivery Functions</h1>

    <h2>calculateTip(bill, percent)</h2>
    <pre id="tipOutput"></pre>

    <h2>getDeliveryFee(total, city)</h2>
    <pre id="deliveryOutput"></pre>

  </div>
    

    <script>
        // ---------- Functions ----------

        function calculateTip(bill, percent) {
            const tip = bill * (percent / 100);
            return Number(tip.toFixed(2));
        }

        function getDeliveryFee(total, city) {
            if (total > 200)
                return 0;

            const c = city.trim().toLowerCase();

            if (c === 'kabul')
                return 5.00;
            if (c === 'herat') 
                return 8.00;
            if (c === 'mazar' || c === 'mazar-e-sharif') 
                return 3.00;
            return 6.00;
        }

        // ---------- Call each function 3 times ----------

        const tip1 = calculateTip(100, 10);
        const tip2 = calculateTip(45.50, 18);
        const tip3 = calculateTip(230, 7.5);

        const fee1 = getDeliveryFee(25, 'Kabul');
        const fee2 = getDeliveryFee(120, 'Herat');
        const fee3 = getDeliveryFee(8, 'Mazar');

        // ---------- Log to console ----------

        console.log('--- calculateTip ---');
        console.log('calculateTip(100, 10)   =', tip1);
        console.log('calculateTip(45.50, 18) =', tip2);
        console.log('calculateTip(230, 7.5)  =', tip3);

        console.log('--- getDeliveryFee ---');
        console.log('getDeliveryFee(25, "Kabul")  =', fee1);
        console.log('getDeliveryFee(120, "Herat") =', fee2);
        console.log('getDeliveryFee(8, "Mazar")   =', fee3);

        // ---------- Show output on the page ----------

        document.getElementById('tipOutput').textContent =
            `calculateTip(100, 10)   = ${tip1}\n` +
            `calculateTip(45.50, 18) = ${tip2}\n` +
            `calculateTip(230, 7.5)  = ${tip3}`;

        document.getElementById('deliveryOutput').textContent =
            `getDeliveryFee(25, "Kabul")  = ${fee1}\n` +
            `getDeliveryFee(120, "Herat") = ${fee2}\n` +
            `getDeliveryFee(8, "Mazar")   = ${fee3}`;
    </script>
</body>
</html>
